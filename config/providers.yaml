providers:
  llm:
    enabled: true
    provider: ollama  # openai or ollama
    historyLimit: 20  # most recent messages of the conversation sent with each request
    openai:
      model: gpt-6-luna
      maxTokens: 300
      temperature: 0.7
    ollama:
      model: gpt-oss:20b
      baseUrl: "http://studio:11434"
      maxTokens: 300
      temperature: 0.7

  tts:
    enabled: true
    provider: elevenlabs
    elevenlabs:
      voiceId: EXAVITQu4vr4xnSDxMaL  # Sarah, until a voice is picked on /control
      model: eleven_v4_turbo

  stt:
    enabled: true
    # openai, local, or web. Hears what's said after the wake word. With the wake word off
    # (wakeWord.enabled: false in config/locales/*/character.yaml), it hears everything said
    # in the room.
    provider: openai
    wakeWord:
      # Hears everything said in the room while waiting for the wake word. Only local is
      # allowed, so none of it leaves this machine. If local Whisper is down, the wake word
      # stops working: nothing falls back to provider.
      provider: local
      maxRecordingDuration: 10000  # ms after sound starts that a recording is cut, so talk can't delay the wake word
      overlap: 3000                # ms the next recording starts before the cut, so the phrase is whole in one
    openai:
      model: gpt-transcribe
      # language is loaded from locale preset
      temperature: 0
    local:
      baseUrl: "http://whisper:8000"  # speaches, in compose.yaml
      model: Systran/faster-whisper-small  # the full ID: speaches answers "small" with a 404
      # language is loaded from locale preset
    web:
      # language is loaded from locale preset
    silenceDetection:
      silenceThreshold: 1.5      # seconds of silence before stopping
      volumeThreshold: 0.02      # RMS volume threshold (0-1)
      minRecordingDuration: 500  # minimum ms before silence detection
      maxRecordingDuration: 60000 # maximum recording duration in ms

  embedding:
    enabled: true
    provider: ollama  # ollama or openai. PLaMo server provides Ollama-compatible API
    ollama:
      model: plamo-embedding-1b
      baseUrl: "http://studio:8000"
    openai:
      model: text-embedding-3-small

  memory:
    enabled: true
    # RAG settings
    rag:
      topK: 8
      threshold: 0.3
    # Memory extraction settings
    extraction:
      autoExtract: true
      minConfidence: 0.5

  vlm:
    enabled: true
    provider: ollama  # ollama or openai
    ollama:
      model: llava:7b
      baseUrl: "http://studio:11434"
    openai:
      model: gpt-6-luna
