# German locale preset
# Applied when app.locale is "de"

# Time settings
time:
  timezone: "Europe/Berlin"

# Weather settings
weather:
  locations:
    - name: "Berlin"
      latitude: 52.5200
      longitude: 13.4050
    - name: "München"
      latitude: 48.1351
      longitude: 11.5820
  defaultLocation: "Berlin"

# Clock plugin settings
clock:
  timezone: "Europe/Berlin"
  format24h: true
  locale: "de-DE"

# Speech-to-Text settings
stt:
  language: "de"

# Text-to-Speech settings: the ElevenLabs voice until one is picked on /control, unless
# providers.yaml sets tts.elevenlabs.voiceId
tts:
  voiceId: "XrExE9yKIg1WjnnlVkGX"  # Matilda, which ElevenLabs has verified for German, unlike Sarah
