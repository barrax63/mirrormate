# Mac Studio deployment
# Run heavy services: PLaMo Embedding (Ollama runs natively, and Whisper runs next to the
# app in compose.yaml)
# Usage: docker compose -f compose.studio.yaml up -d

name: mirrormate-studio

services:
  plamo-embedding:
    build:
      context: ./plamo-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
