name: CI

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "config/**"
      - "plugins/**"
      - "messages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "vitest.config.ts"
      - "e2e/**"
      - "playwright.config.ts"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "src/**"
      - "config/**"
      - "plugins/**"
      - "messages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "vitest.config.ts"
      - "e2e/**"
      - "playwright.config.ts"
      - "Dockerfile"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high
