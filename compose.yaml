# Production deployment (Raspberry Pi / any host)
# Runs the app and local Whisper. Everything else is OpenAI and ElevenLabs, so .env needs
# OPENAI_API_KEY and ELEVENLABS_API_KEY.
# Usage: docker compose up -d
#
# Optional: to use Ollama or PLaMo instead, as http://studio:... in config/providers.yaml, set
# STUDIO_IP in .env to the machine running them:
#   STUDIO_IP=host-gateway   this machine, the default
#   STUDIO_IP=100.x.x.x      another machine, such as its Tailscale IP (tailscale ip -4)

services:
  mirrormate:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # The app has no authentication, so this machine only unless BIND_ADDRESS is set
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    extra_hosts:
      - "studio:${STUDIO_IP:-host-gateway}"
    volumes:
      - ./config:/app/config:ro
      - mirrormate-data:/app/data
    depends_on:
      whisper:
        condition: service_healthy
    restart: unless-stopped

  # Local Whisper (speaches), at http://whisper:8000 in config/providers.yaml. It hears
  # everything said in the room while the app waits for the wake word, so that stays on this
  # machine. No port is published, so only the app can reach it.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    environment:
      - 'PRELOAD_MODELS=["Systran/faster-whisper-small"]'
      - ENABLE_UI=false
      - WHISPER__INFERENCE_DEVICE=cpu
      # Keeps the model loaded. Otherwise it's unloaded after 5 quiet minutes, and the next
      # wake word waits a second longer while it loads again.
      - STT_MODEL_TTL=-1
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      # Answers only once the model is downloaded, which the first start does
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s
    restart: unless-stopped

volumes:
  mirrormate-data:
  whisper-models:
