# Points every provider at e2e/mock-backends.mjs. OpenAI gets there through OPENAI_BASE_URL
# in playwright.config.ts, and ElevenLabs through tts.elevenlabs.baseUrl.
providers:
  llm:
    enabled: true
    provider: openai
    openai:
      model: mock-llm
      maxTokens: 300
      temperature: 0.7

  tts:
    enabled: true
    provider: elevenlabs
    elevenlabs:
      # No model, so the default is what gets tested
      voiceId: mock-voice
      baseUrl: "http://127.0.0.1:11555"
    voicevox:
      speaker: 2
      baseUrl: "http://127.0.0.1:11555"

  stt:
    enabled: true
    provider: openai
    openai:
      model: gpt-transcribe
    silenceDetection:
      silenceThreshold: 0.1

  embedding:
    enabled: true
    provider: ollama
    ollama:
      model: mock-embedding
      baseUrl: "http://127.0.0.1:11555"

  memory:
    enabled: true
    rag:
      topK: 8
      threshold: 0.3
    extraction:
      autoExtract: true
      minConfidence: 0.5

  vlm:
    enabled: true
    provider: ollama
    ollama:
      model: mock-vlm
      baseUrl: "http://127.0.0.1:11555"
