# Points every provider at e2e/mock-backends.mjs. OpenAI gets there through OPENAI_BASE_URL
# in playwright.config.ts, ElevenLabs through tts.elevenlabs.baseUrl, and local Whisper
# through stt.local.baseUrl.
providers:
  llm:
    enabled: true
    provider: openai
    # Small, so tests reach it in a few turns
    historyLimit: 4
    openai:
      model: mock-llm
      maxTokens: 300
      temperature: 0.7

  tts:
    enabled: true
    provider: elevenlabs
    elevenlabs:
      # No model, so the default is what gets tested
      voiceId: mock-voice
      baseUrl: "http://127.0.0.1:11555"

  stt:
    enabled: true
    provider: openai
    wakeWord:
      provider: local
      # Short, so tests reach the cut quickly
      maxRecordingDuration: 2000
      overlap: 1000
    openai:
      model: gpt-transcribe
    local:
      # Its own path, so tests can tell fake local Whisper from fake OpenAI
      baseUrl: "http://127.0.0.1:11555/local-whisper"
      model: Systran/faster-whisper-small
    silenceDetection:
      silenceThreshold: 0.1

  # No model, so the default is what gets tested
  embedding:
    enabled: true
    provider: openai

  memory:
    enabled: true
    rag:
      topK: 8
      threshold: 0.3
    extraction:
      autoExtract: true
      minConfidence: 0.5

  # No model, so the default is what gets tested
  vlm:
    enabled: true
    provider: openai
